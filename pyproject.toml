[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anas-ports-pro"
version = "1.1.0"
description = "TCP port scanner for authorized security testing"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Anas Khshan"}]

[project.scripts]
anas-ports = "anas_ports.cli:main"

[tool.setuptools.packages.find]
include = ["anas_ports*"]
